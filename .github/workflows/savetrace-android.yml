name: Build SaveTrace v1 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/savetrace-android.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/SAVETRACE_BUILD_TRIGGER'

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          glslangValidator --version

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        run: yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android build packages
        run: |
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"

      - name: Generate SDL Java sources
        working-directory: src/android
        run: |
          ./gradlew ':app:configureCMakeRelWithDebInfo[arm64-v8a]' --no-daemon --stacktrace
          test -f ../../externals/generated/sdl/java/org/libsdl/app/SDL.java
          echo "SDL Java sources generated successfully"

      - name: Build ARM64 diagnostic APK
        working-directory: src/android
        run: ./gradlew assembleMainlineRelWithDebInfo --no-daemon --stacktrace

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eden-SaveTrace-v1-Android-ARM64
          path: src/android/app/build/outputs/apk/mainline/relWithDebInfo/app-mainline-relWithDebInfo.apk
          if-no-files-found: error
          retention-days: 14
